spring:
  application:
    name: it-support-ticket
  datasource:
    url: jdbc:sqlite:./target/it-support-ticket-test.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false

it:
  support:
    ticket:
      database:
        path: ./target/it-support-ticket-test.db
      demo-data:
        enabled: false
